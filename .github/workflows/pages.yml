name: Verificar y publicar PRAM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pram-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Verificar JavaScript y recursos
        run: |
          node --check app.js
          node scripts/check.mjs
      - name: Preparar sitio estático
        run: |
          mkdir _site
          cp *.html styles.css app.js .nojekyll _site/
          cp -r assets _site/
      - name: Configurar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Subir sitio
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

